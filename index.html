<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Beam Analysis Plot</title>

    <style>

        body {

            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }

        h2 {

            margin-bottom: 20px;
        }

        .container {

            max-width: 1200px;
            margin: auto;
        }

        .form-box {

            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        table {

            width: 100%;
        }

        td {

            padding: 8px;
        }

        input,
        select {

            width: 100%;
            padding: 8px;

            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {

            background: red;
            color: white;

            border: none;

            padding: 10px 20px;

            border-radius: 5px;

            cursor: pointer;
        }

        button:hover {

            opacity: 0.9;
        }

        .chart-container {

            background: white;

            margin-top: 30px;

            padding: 20px;

            border-radius: 10px;

            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        canvas {

            width: 100% !important;
            height: 500px !important;
        }

        .reaction-box {

            margin-top: 20px;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .reaction-box p {

            margin: 8px 0;
            font-size: 16px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="form-box">

        <h2>Beam Analysis Calculator</h2>

        <form>

            <table>

                <tr>

                    <td>Condition</td>

                    <td>

                        <select
                            name="condition"
                            id="condition"
                        >

                            <option value="simply-supported">
                                Simply Supported
                            </option>

                            <option value="two-span-unequal" selected>
                                Two Span Unequal
                            </option>

                        </select>

                    </td>

                </tr>

                <tr>

                    <td>Load Force (w)</td>

                    <td>

                        <input
                            type="number"
                            id="w"
                            value="28.86"
                            step="0.01"
                        >

                    </td>

                </tr>

                <tr>

                    <td>Primary Span (L1)</td>

                    <td>

                        <input
                            type="number"
                            id="primarySpan"
                            value="4"
                            step="0.01"
                        >

                    </td>

                </tr>

                <tr>

                    <td>Secondary Span (L2)</td>

                    <td>

                        <input
                            type="number"
                            id="secondarySpan"
                            value="5"
                            step="0.01"
                        >

                    </td>

                </tr>

                <tr>

                    <td>j2</td>

                    <td>

                        <input
                            type="number"
                            id="j2"
                            value="4"
                            step="0.01"
                        >

                    </td>

                </tr>

                <tr>

                    <td>Bending Stiffness (EI)</td>

                    <td>

                        <input
                            type="number"
                            id="EI"
                            value="3150000000000"
                        >

                    </td>

                </tr>

                <tr>

                    <td colspan="2">

                        <button
                            type="button"
                            id="calculate"
                        >
                            Calculate
                        </button>

                    </td>

                </tr>

            </table>

        </form>

    </div>

    <div
        class="reaction-box"
        id="reactionBox"
    ></div>

    <!-- DEFLECTION -->
    <div class="chart-container">

        <canvas id="deflection_plot"></canvas>

    </div>

    <!-- SHEAR -->
    <div class="chart-container">

        <canvas id="shear_force_plot"></canvas>

    </div>

    <!-- BENDING -->
    <div class="chart-container">

        <canvas id="bending_moment_plot"></canvas>

    </div>

</div>

<!-- CHART JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- BEAM ANALYSIS -->
<script src="js/beam-analysis.js"></script>

<script>

    function floatVal(id) {

        return parseFloat(
            document.getElementById(id).value
        ) || 0;
    }

    function stringVal(id) {

        return document.getElementById(id).value;
    }

    /**
     * Create chart
     */

    function createChart(
        canvasId,
        title,
        yTitle,
        dataPoints
    ) {

        const canvas =
            document.getElementById(canvasId);

        const ctx =
            canvas.getContext('2d');

        if (canvas.chartInstance) {

            canvas.chartInstance.destroy();
        }

        canvas.chartInstance = new Chart(ctx, {

            type: 'line',

            data: {

                datasets: [{

                    label: title,

                    data: dataPoints,

                    parsing: false,

                    borderColor: 'red',

                    backgroundColor:
                        'rgba(255,0,0,0.08)',

                    fill: false,

                    tension: 0,

                    borderWidth: 3,

                    pointRadius: 0,

                    pointHoverRadius: 0
                }]
            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                animation: false,

                plugins: {

                    legend: {

                        display: false
                    },

                    title: {

                        display: true,

                        text: title,

                        font: {

                            size: 20
                        }
                    }
                },

                scales: {

                    x: {

                        type: 'linear',

                        title: {

                            display: true,

                            text: 'Span (m)',

                            font: {

                                size: 16
                            }
                        },

                        grid: {

                            color: '#d9d9d9'
                        },

                        ticks: {

                            stepSize: 1
                        }
                    },

                    y: {

                        title: {

                            display: true,

                            text: yTitle,

                            font: {

                                size: 16
                            }
                        },

                        grid: {

                            color: '#d9d9d9'
                        }
                    }
                }
            }
        });
    }

    /**
     * MAIN
     */

    document
        .getElementById('calculate')
        .addEventListener('click', function () {

            const condition =
                stringVal('condition');

            const load =
                floatVal('w');

            const beam = new Beam(

                floatVal('primarySpan'),

                floatVal('secondarySpan'),

                new Material('No Name', {

                    EI:
                        floatVal('EI'),

                    j2:
                        floatVal('j2')
                })
            );

            const beamAnalysis =
                new BeamAnalysis();

            const analyzer =
                beamAnalysis.getAnalyzer(
                    condition
                );

            const deflection =
                beamAnalysis.getDeflection(
                    beam,
                    load,
                    condition
                );

            const bending =
                beamAnalysis.getBendingMoment(
                    beam,
                    load,
                    condition
                );

            const shear =
                beamAnalysis.getShearForce(
                    beam,
                    load,
                    condition
                );

            /**
             * TOTAL LENGTH
             */

            let totalLength;

            if (
                condition ===
                'two-span-unequal'
            ) {

                totalLength =
                    beam.getTotalLength();
            }

            else {

                totalLength =
                    beam.primarySpan;
            }

            /**
             * X VALUES
             */

            let xValues = [];

            for (
                let x = 0;
                x <= totalLength;
                x += 0.05
            ) {

                xValues.push(

                    Number(
                        x.toFixed(6)
                    )
                );
            }

            /**
             * IMPORTANT:
             * add support point
             */

            if (
                condition ===
                'two-span-unequal'
            ) {

                const criticalPoints =
                    analyzer.getCriticalPoints(
                        beam,
                        load
                    );

                xValues.push(
                    ...criticalPoints
                );

                /**
                 * ADD EXTRA POINTS
                 * for vertical jump at R2
                 */

                const L1 =
                    beam.primarySpan;

                xValues.push(
                    Number(
                        (L1 - 0.0001)
                        .toFixed(6)
                    )
                );

                xValues.push(
                    Number(
                        (L1 + 0.0001)
                        .toFixed(6)
                    )
                );
            }

            /**
             * remove duplicates
             */

            xValues = [
                ...new Set(xValues)
            ];

            /**
             * sort
             */

            xValues.sort(
                (a, b) => a - b
            );

            /**
             * BUILD DATA
             */

            const deflectionData = [];
            const shearData = [];
            const bendingData = [];

            xValues.forEach(x => {

                deflectionData.push(
                    deflection.equation(x)
                );

                shearData.push(
                    shear.equation(x)
                );

                bendingData.push(
                    bending.equation(x)
                );
            });

            /**
             * CREATE CHARTS
             */

            createChart(

                'deflection_plot',

                'Deflection Diagram',

                'Deflection (mm)',

                deflectionData
            );

            createChart(

                'shear_force_plot',

                'Shear Force Diagram',

                'Shear Force (kN)',

                shearData
            );

            createChart(

                'bending_moment_plot',

                'Bending Moment Diagram',

                'Bending Moment (kN.m)',

                bendingData
            );

            /**
             * SHOW REACTION
             */

            const reactionBox =
                document.getElementById(
                    'reactionBox'
                );

            if (
                condition ===
                'two-span-unequal'
            ) {

                const reaction =
                    analyzer.getReaction(
                        beam,
                        load
                    );

                reactionBox.innerHTML = `

                    <h3>Reaction Result</h3>

                    <p><strong>M1</strong> = ${reaction.M1.toFixed(3)} kN.m</p>

                    <p><strong>R1</strong> = ${reaction.R1.toFixed(3)} kN</p>

                    <p><strong>R2</strong> = ${reaction.R2.toFixed(3)} kN</p>

                    <p><strong>R3</strong> = ${reaction.R3.toFixed(3)} kN</p>
                `;
            }

            else {

                reactionBox.innerHTML = '';
            }
        });

    /**
     * AUTO RUN
     */

    document
        .getElementById('calculate')
        .click();

</script>

</body>
</html>
